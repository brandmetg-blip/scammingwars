<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scam Wars · Summer 2025</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&family=Playfair+Display:wght@700&display=swap');

*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

:root {
  --bg:    #0e0f11;
  --surf:  #161719;
  --surf2: #1e2024;
  --line:  rgba(255,255,255,.08);
  --line2: rgba(255,255,255,.13);
  --txt:   #f0f0f0;
  --muted: #6b6e77;
  --a:     #ef5350;
  --a-dim: rgba(239,83,80,.12);
  --b:     #f0b429;
  --b-dim: rgba(240,180,41,.12);
  --c:     #42a5f5;
  --c-dim: rgba(66,165,245,.12);
  --accent:#a78bfa;
}

html, body {
  min-height: 100vh;
  background: var(--bg);
  color: var(--txt);
  font-family: 'DM Sans', system-ui, sans-serif;
  font-size: 15px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

/* ── NAV TABS ── */
.nav {
  position: sticky; top: 0; z-index: 50;
  background: rgba(14,15,17,.88);
  backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--line);
  display: flex; align-items: center;
  padding: 0 24px;
  gap: 2px;
  height: 52px;
}
.nav-title {
  font-family: 'Playfair Display', serif;
  font-size: 17px;
  color: var(--txt);
  margin-right: auto;
  letter-spacing: -.3px;
}
.nav-title span { color: var(--b); }
.tab-btn {
  background: none; border: none; cursor: pointer;
  font-family: 'DM Sans', sans-serif;
  font-size: 13px; font-weight: 500;
  color: var(--muted);
  padding: 6px 14px; border-radius: 8px;
  transition: .15s; letter-spacing: .2px;
  display: flex; align-items: center; gap: 6px;
}
.tab-btn svg { opacity: .6; }
.tab-btn:hover { color: var(--txt); background: var(--surf2); }
.tab-btn.active { color: var(--txt); background: var(--surf2); }
.tab-btn.active svg { opacity: 1; }
.sync-dot {
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--muted); margin-left: 8px;
  transition: background .4s;
}
.sync-dot.ok  { background: #4caf50; box-shadow: 0 0 6px #4caf5088; }
.sync-dot.err { background: var(--a); }
.sync-dot.saving { background: var(--b); }

/* ── PAGES ── */
.page { display: none; }
.page.active { display: block; }

/* ══════════════════════════════════
   DISPLAY PAGE
══════════════════════════════════ */
.display-wrap {
  max-width: 900px; margin: 0 auto; padding: 40px 24px 80px;
}

/* headline */
.headline {
  text-align: center; margin-bottom: 48px;
}
.headline h1 {
  font-family: 'Playfair Display', serif;
  font-size: clamp(32px, 6vw, 56px);
  font-weight: 700; line-height: 1.1;
  letter-spacing: -.5px;
}
.headline h1 em { font-style: normal; color: var(--b); }
.headline p {
  margin-top: 10px;
  color: var(--muted); font-size: 13px; letter-spacing: 2px;
  text-transform: uppercase;
}

/* 3-col podium */
.podium {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 14px;
  margin-bottom: 36px;
}
.pod {
  border: 1px solid var(--line2);
  border-radius: 20px;
  padding: 28px 20px 24px;
  text-align: center;
  background: var(--surf);
  position: relative;
  transition: transform .3s ease, box-shadow .3s ease;
  overflow: hidden;
}
.pod::before {
  content: '';
  position: absolute; inset: 0; border-radius: 19px;
  opacity: 0; transition: opacity .3s;
}
.pod.A::before { background: var(--a-dim); }
.pod.B::before { background: var(--b-dim); }
.pod.C::before { background: var(--c-dim); }
.pod.lead { border-width: 1.5px; transform: translateY(-6px); }
.pod.A.lead { border-color: var(--a); box-shadow: 0 12px 40px rgba(239,83,80,.2); }
.pod.B.lead { border-color: var(--b); box-shadow: 0 12px 40px rgba(240,180,41,.2); }
.pod.C.lead { border-color: var(--c); box-shadow: 0 12px 40px rgba(66,165,245,.2); }
.pod.lead::before { opacity: 1; }
.pod.pop { animation: podpop .5s cubic-bezier(.2,1.5,.4,1) forwards; }
@keyframes podpop { 0%{transform:translateY(-6px)} 50%{transform:translateY(-14px) scale(1.03)} 100%{transform:translateY(-6px)} }

.pod-crown { height: 28px; font-size: 20px; display: flex; align-items: center; justify-content: center; margin-bottom: 6px; }
.pod-emoji { font-size: 32px; margin-bottom: 10px; }
.pod-name {
  font-size: 11px; font-weight: 600; letter-spacing: 2px;
  text-transform: uppercase; color: var(--muted);
  margin-bottom: 14px;
}
.pod-amount {
  font-family: 'DM Mono', monospace;
  font-size: clamp(24px, 4vw, 38px);
  font-weight: 500; letter-spacing: -1px;
}
.pod.A .pod-amount { color: var(--a); }
.pod.B .pod-amount { color: var(--b); }
.pod.C .pod-amount { color: var(--c); }
.pod-tag {
  margin-top: 10px; font-size: 11px;
  color: var(--muted); min-height: 14px;
  font-weight: 500;
}

/* progress bar */
.progress-section { margin-bottom: 44px; }
.progress-label {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 8px;
}
.progress-label span { font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted); }
.progress-track {
  height: 6px; border-radius: 99px;
  background: var(--surf2);
  display: flex; overflow: hidden;
  gap: 2px;
}
.progress-track .seg {
  height: 100%; border-radius: 99px;
  transition: width .8s cubic-bezier(.3,1.2,.4,1);
  min-width: 0;
}
.seg.A { background: var(--a); }
.seg.B { background: var(--b); }
.seg.C { background: var(--c); }

/* charts */
.charts-grid { display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-bottom:36px; }
@media(max-width:600px){ .charts-grid { grid-template-columns:1fr; } }
.chart-card { background:var(--surf); border:1px solid var(--line); border-radius:16px; padding:20px 20px 16px; }
.chart-title { font-size:11px; font-weight:600; letter-spacing:2px; text-transform:uppercase; color:var(--muted); margin-bottom:16px; }
.chart-canvas-wrap { position:relative; height:200px; }

/* breakdown table */
.breakdown {
  background: var(--surf); border: 1px solid var(--line);
  border-radius: 16px; overflow: hidden;
}
.breakdown-title {
  padding: 18px 24px 14px;
  font-size: 11px; font-weight: 600; letter-spacing: 2px;
  text-transform: uppercase; color: var(--muted);
  border-bottom: 1px solid var(--line);
}
.brow {
  display: grid; grid-template-columns: 32px 1fr repeat(4, 80px);
  align-items: center; gap: 0;
  padding: 13px 24px;
  border-bottom: 1px solid var(--line);
  transition: background .15s;
}
.brow:last-child { border-bottom: none; }
.brow:hover { background: var(--surf2); }
.brow.team-row {
  background: rgba(255,255,255,.02);
  padding: 10px 24px;
}
.brow.team-row .brow-name {
  font-weight: 600; font-size: 12px; letter-spacing: 1.5px;
  text-transform: uppercase; color: var(--muted);
}
.brow-emoji { font-size: 16px; }
.brow-name { font-size: 14px; font-weight: 500; }
.brow-mo {
  font-family: 'DM Mono', monospace;
  font-size: 13px; text-align: right;
  color: var(--muted);
}
.brow-mo.has-val { color: var(--txt); }
.brow-total {
  font-family: 'DM Mono', monospace;
  font-size: 14px; font-weight: 500; text-align: right;
}
.brow.A .brow-total { color: var(--a); }
.brow.B .brow-total { color: var(--b); }
.brow.C .brow-total { color: var(--c); }
.brow.team-row .brow-total { font-size: 15px; font-weight: 600; }
.col-header {
  display: grid; grid-template-columns: 32px 1fr repeat(4, 80px);
  padding: 0 24px 8px;
  gap: 0;
}
.col-header span {
  font-size: 10px; letter-spacing: 1.5px; text-transform: uppercase;
  color: var(--muted); text-align: right;
}
.col-header span:first-child,
.col-header span:nth-child(2) { text-align: left; }

/* ══════════════════════════════════
   INPUT PAGE
══════════════════════════════════ */
.input-wrap {
  max-width: 680px; margin: 0 auto; padding: 36px 24px 80px;
}
.input-section { margin-bottom: 36px; }
.input-section-title {
  display: flex; align-items: center; gap: 10px;
  font-size: 11px; font-weight: 600; letter-spacing: 2px;
  text-transform: uppercase; color: var(--muted);
  margin-bottom: 16px;
}
.input-section-title::after {
  content: ''; flex: 1; height: 1px; background: var(--line2);
}
.input-section-title .dot {
  width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
}
.dot.A { background: var(--a); }
.dot.B { background: var(--b); }
.dot.C { background: var(--c); }

.input-card {
  background: var(--surf);
  border: 1px solid var(--line2);
  border-radius: 14px;
  padding: 20px 22px;
  margin-bottom: 10px;
  display: grid;
  grid-template-columns: 1fr auto;
  align-items: center;
  gap: 16px;
}
.input-card-left { display: flex; align-items: center; gap: 12px; }
.input-card-emoji { font-size: 22px; }
.input-card-name { font-size: 15px; font-weight: 500; }
.input-card-subtotal {
  font-family: 'DM Mono', monospace;
  font-size: 13px; color: var(--muted);
  margin-top: 1px;
}
.input-months {
  display: flex; gap: 8px;
}
.input-month { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
.input-month label {
  font-size: 10px; letter-spacing: 1.5px; text-transform: uppercase;
  color: var(--muted); font-weight: 500;
}
.input-month input {
  width: 80px; padding: 8px 10px;
  background: var(--surf2); border: 1px solid var(--line2);
  border-radius: 8px; color: var(--txt);
  font-family: 'DM Mono', monospace; font-size: 14px;
  text-align: center; transition: .15s;
  -moz-appearance: textfield;
}
.input-month input::-webkit-inner-spin-button,
.input-month input::-webkit-outer-spin-button { -webkit-appearance: none; }
.input-month input:focus {
  outline: none; border-color: rgba(255,255,255,.3);
  background: var(--surf); box-shadow: 0 0 0 3px rgba(255,255,255,.05);
}
.input-month.A input:focus { border-color: var(--a); box-shadow: 0 0 0 3px var(--a-dim); }
.input-month.B input:focus { border-color: var(--b); box-shadow: 0 0 0 3px var(--b-dim); }
.input-month.C input:focus { border-color: var(--c); box-shadow: 0 0 0 3px var(--c-dim); }
.input-month input::placeholder { color: var(--muted); opacity: .6; }

/* prize pool */
.prize-pool {
  position: relative;
  margin: 0 0 44px;
  border-radius: 24px;
  overflow: visible;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 36px 24px 32px;
  background: linear-gradient(135deg, #1a1508 0%, #0e0f11 60%);
  border: 1px solid rgba(240,180,41,.25);
  box-shadow:
    0 0 0 1px rgba(240,180,41,.08),
    0 8px 40px rgba(240,180,41,.12),
    inset 0 1px 0 rgba(255,255,255,.06);
}
.prize-pool::before {
  content: '';
  position: absolute; inset: 0; border-radius: 24px;
  background: radial-gradient(ellipse 70% 50% at 50% 0%, rgba(240,180,41,.18), transparent 70%);
  pointer-events: none;
}
.prize-label {
  font-size: 11px; font-weight: 600; letter-spacing: 3px;
  text-transform: uppercase; color: rgba(240,180,41,.6);
  margin-bottom: 6px; position: relative; z-index: 1;
}
.prize-amount {
  font-family: 'Playfair Display', serif;
  font-size: clamp(48px, 10vw, 82px);
  font-weight: 700; line-height: 1;
  background: linear-gradient(180deg, #ffe87c 0%, #f0b429 40%, #c87d0e 100%);
  -webkit-background-clip: text; background-clip: text;
  -webkit-text-fill-color: transparent;
  filter: drop-shadow(0 2px 12px rgba(240,180,41,.4));
  position: relative; z-index: 1;
  animation: prizeglow 3s ease-in-out infinite alternate;
}
@keyframes prizeglow {
  from { filter: drop-shadow(0 2px 12px rgba(240,180,41,.3)); }
  to   { filter: drop-shadow(0 4px 28px rgba(240,180,41,.7)); }
}
.prize-sub {
  font-size: 12px; color: rgba(240,180,41,.5); letter-spacing: 2px;
  text-transform: uppercase; margin-top: 8px; position: relative; z-index: 1;
}
/* coin pile SVGs */
.coins-left, .coins-right {
  position: absolute; bottom: -12px;
  pointer-events: none; z-index: 2;
}
.coins-left  { left:  -10px; }
.coins-right { right: -10px; transform: scaleX(-1); }
/* floating sparkles */
.sparkle {
  position: absolute; border-radius: 50%; pointer-events: none;
  animation: sparklefly linear infinite;
  background: radial-gradient(circle, #ffe87c, transparent);
}
@keyframes sparklefly {
  0%   { transform: translateY(0) scale(1); opacity: .8; }
  100% { transform: translateY(-60px) scale(0); opacity: 0; }
}

/* toast */
.toast {
  position: fixed; bottom: 28px; left: 50%;
  transform: translateX(-50%) translateY(70px);
  background: var(--surf); border: 1px solid var(--line2);
  border-radius: 99px; padding: 10px 22px;
  font-size: 13px; font-weight: 500; color: var(--txt);
  z-index: 100; pointer-events: none;
  transition: transform .35s cubic-bezier(.2,1.4,.5,1), opacity .35s;
  opacity: 0; white-space: nowrap;
  box-shadow: 0 8px 32px rgba(0,0,0,.5);
}
.toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
</style>
</head>

            <linearGradient id="cg3r" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#ffed90"/><stop offset="100%" stop-color="#d48c10"/></linearGradient>
            <linearGradient id="cgt3r" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#fff7b0"/><stop offset="100%" stop-color="#f0b429"/></linearGradient>
            <linearGradient id="bagg2" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#f0b429"/><stop offset="50%" stop-color="#c87d0e"/><stop offset="100%" stop-color="#7a4a00"/></linearGradient>
            <linearGradient id="bagknot2" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#ffe87c"/><stop offset="100%" stop-color="#c87d0e"/></linearGradient>
          </defs>
        </svg>
      </div>

      <div class="prize-label">🏆 Summer Prize Pool</div>
      <div class="prize-amount">$5,000</div>
      <div class="prize-sub">Winner takes all · Last team standing eats</div>
    </div>

    <div class="headline">
      <h1>Scam <em>Wars</em></h1>
      <p>June · July · August · 2025</p>
    </div>

    <div class="podium" id="podium"></div>

    <div class="progress-section">
      <div class="progress-label">
        <span id="prog-a-lbl">Team A — 0%</span>
        <span>Share of total</span>
        <span id="prog-c-lbl">Team C — 0%</span>
      </div>
      <div class="progress-track">
        <div class="seg A" id="seg-a" style="width:33%"></div>
        <div class="seg B" id="seg-b" style="width:34%"></div>
        <div class="seg C" id="seg-c" style="width:33%"></div>
      </div>
    </div>

    <div class="charts-grid">
      <div class="chart-card">
        <div class="chart-title">Monthly earnings by team</div>
        <div class="chart-canvas-wrap"><canvas id="chart-bar"></canvas></div>
      </div>
      <div class="chart-card">
        <div class="chart-title">Cumulative race</div>
        <div class="chart-canvas-wrap"><canvas id="chart-line"></canvas></div>
      </div>
    </div>

    <div class="breakdown">
      <div class="breakdown-title">Full Breakdown</div>
      <div class="col-header">
        <span></span><span>Player</span>
        <span>June</span><span>July</span><span>Aug</span><span>Total</span>
      </div>
      <div id="breakdown-body"></div>
    </div>
  </div>
</div>

<!-- ═══ INPUT PAGE ═══ -->
<div class="page" id="page-input">
  <div class="input-wrap">
    <div id="input-body"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<audio id="firstSound" src="first.mp3" preload="auto"></audio>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script>
const JSONBIN_BIN_ID  = "6a18597521f9ee59d295b48b";
const JSONBIN_API_KEY = "$2a$10$wUL5vHPci5ylelUPqniAi.03JVw.StV/nmHsQvIlSaWTCvi6L161e";
const BIN_URL = "https://api.jsonbin.io/v3/b/" + JSONBIN_BIN_ID;
const HDRS = { "Content-Type": "application/json", "X-Master-Key": JSONBIN_API_KEY };

const TEAMS = {
  A: { side:'A', name:'Lazic & Velja',  color:'#ef5350', emoji:'🐺🐉', members:[
    {id:'lazic',name:'Lazic',emoji:'🐺'},
    {id:'velja',name:'Velja',emoji:'🐉'}
  ]},
  B: { side:'B', name:'Dusan & David',  color:'#f0b429', emoji:'👑🤴', members:[
    {id:'dusan',name:'Dusan',emoji:'👑'},
    {id:'david',name:'David',emoji:'🤴'}
  ]},
  C: { side:'C', name:'Simela & Injac', color:'#42a5f5', emoji:'🌊💙', members:[
    {id:'simela',name:'Simela',emoji:'🌊'},
    {id:'injac', name:'Injac', emoji:'💙'}
  ]},
};
const MONTHS = ['June', 'July', 'Aug'];

const TAGS = {
  lead: ['Leading the pack', 'On top right now', 'Setting the pace', 'Ahead of the curve'],
  lose: ['Chasing the leaders', 'Room to grow', 'Still in the game', 'Building momentum'],
  tie:  ['All tied up', 'Neck and neck'],
};

let data = {};
Object.values(TEAMS).forEach(t => t.members.forEach(m => data[m.id] = [0,0,0]));
let currentLeader = null, activeInput = null, saveTimer = null;

// ── sync indicator
function setSync(state) {
  const d = document.getElementById('sync-dot');
  d.className = 'sync-dot ' + state;
}

// ── cloud
async function cloudLoad() {
  try {
    const r = await fetch(BIN_URL + "/latest", { headers: HDRS });
    if (!r.ok) throw 0;
    const rec = (await r.json()).record || {};
    Object.keys(data).forEach(id => { if (Array.isArray(rec[id])) data[id] = rec[id]; });
    setSync('ok');
    refreshInputs(); render();
  } catch(e) { setSync('err'); }
}
async function cloudSave() {
  setSync('saving');
  try {
    const r = await fetch(BIN_URL, { method:'PUT', headers:HDRS, body:JSON.stringify(data) });
    if (!r.ok) throw 0;
    setSync('ok');
  } catch(e) { setSync('err'); }
}
function queueSave() { clearTimeout(saveTimer); saveTimer = setTimeout(cloudSave, 700); }

// ── formatting
const fmt   = n => '$' + (n || 0).toLocaleString('en-US');
const fmtPc = n => Math.round(n) + '%';
const memberTotal = id   => data[id].reduce((a, b) => a + (+b || 0), 0);
const teamTotal   = side => TEAMS[side].members.reduce((s, m) => s + memberTotal(m.id), 0);

// ── tabs
function switchTab(tab) {
  document.getElementById('page-display').classList.toggle('active', tab === 'display');
  document.getElementById('page-input').classList.toggle('active', tab === 'input');
  document.getElementById('tab-display').classList.toggle('active', tab === 'display');
  document.getElementById('tab-input').classList.toggle('active', tab === 'input');
}

// ── build input page
function buildInputPage() {
  const wrap = document.getElementById('input-body');
  wrap.innerHTML = '';
  ['A','B','C'].forEach(side => {
    const t = TEAMS[side];
    const sec = document.createElement('div'); sec.className = 'input-section';
    sec.innerHTML = `<div class="input-section-title"><div class="dot ${side}"></div>${t.emoji} ${t.name}</div>`;
    t.members.forEach(m => {
      const card = document.createElement('div'); card.className = 'input-card';
      card.innerHTML = `
        <div class="input-card-left">
          <span class="input-card-emoji">${m.emoji}</span>
          <div>
            <div class="input-card-name">${m.name}</div>
            <div class="input-card-subtotal" id="sub-${m.id}">${fmt(memberTotal(m.id))}</div>
          </div>
        </div>
        <div class="input-months">
          ${MONTHS.map((mo, i) => `
            <div class="input-month ${side}">
              <label>${mo}</label>
              <input type="number" inputmode="decimal" placeholder="0"
                id="in-${m.id}-${i}" value="${data[m.id][i] || ''}"
                onfocus="activeInput='${m.id}-${i}'"
                onblur="activeInput=null"
                oninput="edit('${m.id}',${i},this.value)">
            </div>`).join('')}
        </div>`;
      sec.appendChild(card);
    });
    wrap.appendChild(sec);
  });
}

function refreshInputs() {
  Object.keys(data).forEach(id => {
    for (let i = 0; i < 3; i++) {
      const el = document.getElementById('in-' + id + '-' + i);
      if (el && activeInput !== id + '-' + i) el.value = data[id][i] || '';
    }
    const sub = document.getElementById('sub-' + id);
    if (sub) sub.textContent = fmt(memberTotal(id));
  });
}

function edit(id, i, v) {
  data[id][i] = v === '' ? 0 : Math.max(0, +v);
  const sub = document.getElementById('sub-' + id);
  if (sub) sub.textContent = fmt(memberTotal(id));
  render(); queueSave();
}

// ── toast
let toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2800);
}

// ── sound
function playFirstSting() {
  const a = document.getElementById('firstSound');
  if (!a) return;
  try { a.currentTime = 0; a.volume = 0.7; a.play().catch(()=>{}); } catch(e){}
}

// ── charts
const CHART_OPTS_BASE = {
  responsive: true, maintainAspectRatio: false,
  plugins: {
    legend: { display: true, position: 'bottom', labels: { color:'#6b6e77', font:{size:11,family:'DM Sans,system-ui,sans-serif'}, boxWidth:10, boxHeight:10, padding:14, usePointStyle:true } },
    tooltip: { backgroundColor:'#1e2024', borderColor:'rgba(255,255,255,.1)', borderWidth:1, titleColor:'#f0f0f0', bodyColor:'#9ca3af', padding:10,
      callbacks: { label: ctx => ' '+ctx.dataset.label+': $'+Math.round(ctx.parsed.y).toLocaleString('en-US') } }
  },
  scales: {
    x: { grid:{ color:'rgba(255,255,255,.05)' }, ticks:{ color:'#6b6e77', font:{size:11} } },
    y: { grid:{ color:'rgba(255,255,255,.05)' }, ticks:{ color:'#6b6e77', font:{size:11}, callback: v => '$'+Math.round(v).toLocaleString('en-US') }, beginAtZero:true }
  }
};

let barChart=null, lineChart=null;

function getTeamMonthly(side){ return [0,1,2].map(i=>TEAMS[side].members.reduce((s,m)=>s+(+data[m.id][i]||0),0)); }

function updateBarChart(){
  const datasets = ['A','B','C'].map(s=>({
    label: TEAMS[s].name, data: getTeamMonthly(s),
    backgroundColor: TEAMS[s].color+'44', borderColor: TEAMS[s].color,
    borderWidth:2, borderRadius:6, borderSkipped:false,
  }));
  if(barChart){ barChart.data.datasets.forEach((d,i)=>{ d.data=datasets[i].data; }); barChart.update(); return; }
  const ctx = document.getElementById('chart-bar').getContext('2d');
  barChart = new Chart(ctx, { type:'bar', data:{ labels:MONTHS, datasets }, options: JSON.parse(JSON.stringify(CHART_OPTS_BASE)) });
}

function updateLineChart(){
  const datasets = ['A','B','C'].map(s=>{
    let cum=0;
    const cumData = [0,1,2].map(i=>{ cum+=TEAMS[s].members.reduce((sum,m)=>sum+(+data[m.id][i]||0),0); return cum; });
    return { label:TEAMS[s].name, data:cumData, borderColor:TEAMS[s].color, backgroundColor:TEAMS[s].color+'22',
      borderWidth:2.5, pointRadius:5, pointBackgroundColor:TEAMS[s].color,
      pointBorderColor:'#0e0f11', pointBorderWidth:2, fill:true, tension:.35 };
  });
  if(lineChart){ lineChart.data.datasets.forEach((d,i)=>{ d.data=datasets[i].data; }); lineChart.update(); return; }
  const ctx = document.getElementById('chart-line').getContext('2d');
  lineChart = new Chart(ctx, { type:'line', data:{ labels:MONTHS, datasets }, options: JSON.parse(JSON.stringify(CHART_OPTS_BASE)) });
}

// ── render display page
let flashSide = null;
function render() {
  const a = teamTotal('A'), b = teamTotal('B'), c = teamTotal('C'), sum = a + b + c;

  // progress bar
  const pA = sum ? a/sum*100 : 33.33;
  const pB = sum ? b/sum*100 : 33.34;
  const pC = sum ? c/sum*100 : 33.33;
  document.getElementById('seg-a').style.width = pA + '%';
  document.getElementById('seg-b').style.width = pB + '%';
  document.getElementById('seg-c').style.width = pC + '%';
  document.getElementById('prog-a-lbl').textContent = TEAMS.A.name + ' — ' + fmtPc(pA);
  document.getElementById('prog-c-lbl').textContent = TEAMS.C.name + ' — ' + fmtPc(pC);

  // leader
  const totals = { A:a, B:b, C:c };
  const maxVal = Math.max(a, b, c);
  let leader = null;
  if (sum > 0) {
    const tops = Object.keys(totals).filter(k => totals[k] === maxVal);
    if (tops.length === 1) leader = tops[0];
  }

  if (leader && leader !== currentLeader) {
    const wasNull = currentLeader === null;
    currentLeader = leader;
    if (!wasNull) {
      playFirstSting();
      showToast('👑 ' + TEAMS[leader].name + ' takes the lead');
      flashSide = leader;
      setTimeout(() => { flashSide = null; buildPodium(totals, leader); }, 600);
    }
  } else if (!leader) { currentLeader = null; }

  buildPodium(totals, leader);
  buildBreakdown(totals);
  updateBarChart();
  updateLineChart();
}

function buildPodium(totals, leader) {
  const wrap = document.getElementById('podium'); wrap.innerHTML = '';
  ['A','B','C'].forEach(side => {
    const t = TEAMS[side];
    const isLead = leader === side;
    const total = totals[side];
    const sum = totals.A + totals.B + totals.C;
    let tag = '';
    if (sum === 0) tag = '—';
    else if (!leader) tag = TAGS.tie[0];
    else tag = isLead
      ? TAGS.lead[total % TAGS.lead.length]
      : TAGS.lose[total % TAGS.lose.length];

    const div = document.createElement('div');
    div.className = 'pod ' + side + (isLead ? ' lead' : '') + (flashSide === side ? ' pop' : '');
    div.innerHTML = `
      <div class="pod-crown">${isLead ? '👑' : ''}</div>
      <div class="pod-emoji">${t.emoji}</div>
      <div class="pod-name">${t.name}</div>
      <div class="pod-amount">${fmt(total)}</div>
      <div class="pod-tag">${tag}</div>`;
    wrap.appendChild(div);
  });
}

function buildBreakdown(totals) {
  const body = document.getElementById('breakdown-body'); body.innerHTML = '';
  ['A','B','C'].forEach(side => {
    const t = TEAMS[side];
    // team row
    const teamTotal_ = totals[side];
    const tr = document.createElement('div');
    tr.className = 'brow team-row ' + side;
    tr.innerHTML = `
      <div class="brow-emoji">${t.emoji}</div>
      <div class="brow-name">${t.name}</div>
      <div class="brow-mo"></div>
      <div class="brow-mo"></div>
      <div class="brow-mo"></div>
      <div class="brow-total">${fmt(teamTotal_)}</div>`;
    body.appendChild(tr);

    // member rows
    t.members.forEach(m => {
      const vals = data[m.id];
      const row = document.createElement('div');
      row.className = 'brow ' + side;
      row.innerHTML = `
        <div class="brow-emoji">${m.emoji}</div>
        <div class="brow-name">${m.name}</div>
        ${vals.map(v => `<div class="brow-mo ${+v ? 'has-val' : ''}">${+v ? fmt(+v) : '—'}</div>`).join('')}
        <div class="brow-total">${fmt(memberTotal(m.id))}</div>`;
      body.appendChild(row);
    });
  });
}

// ── prize pool sparkles
function spawnSparkle() {
  const pool = document.getElementById('prize-pool');
  if (!pool) return;
  const s = document.createElement('div');
  s.className = 'sparkle';
  const size = 3 + Math.random() * 6;
  s.style.cssText = `width:${size}px;height:${size}px;left:${10+Math.random()*80}%;bottom:${10+Math.random()*40}%;animation-duration:${1.8+Math.random()*2.2}s`;
  pool.appendChild(s);
  setTimeout(() => s.remove(), 4000);
}
setInterval(spawnSparkle, 300);

// ── init
buildInputPage();
render();
cloudLoad();
setInterval(cloudLoad, 5000);
</script>
</body>
</html>
